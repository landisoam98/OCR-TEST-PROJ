# The installer writes config.yaml for you (C:\ProgramData\BHP Scanner\config.yaml).
# This file lists every setting you can add to it.

# Where the printer/scanner saves PDFs
inbox: 'D:\Scans\Inbox'

# Where filed delivery notes go: <output_root>\2027\01 January 2027\Customer A\
output_root: 'D:\Delivery Notes'

# Optional (these are the defaults):
# review_folder: 'D:\Delivery Notes\_Needs Review'
# duplicates_folder: 'D:\Delivery Notes\_Duplicates'
# data_folder: 'C:\BHP Scanner\data'        # log.csv, customers.json, dnfiler.log

# Your own company name(s) as printed on the delivery notes, so they are never taken as the customer
own_company_names:
  - 'BHP'

# How dates like 01/02/2027 are printed: DMY (1 Feb), MDY (Jan 2), or YMD
date_order: DMY

poll_seconds: 10
stable_seconds: 5          # file must stop changing for this long before it is read

year_folder_format: '{year}'
month_folder_format: '{month:02d} {month_name} {year}'   # 01 January 2027
file_name_format: '{date} {dn_number}'                     # 2027-01-15 DN-12345.pdf

# A new customer name at least this similar (0-100) to an existing folder goes to review instead of
# making a near-duplicate folder
customer_match_review: 80

# Dates outside this window go to review (catches day/month swaps)
max_days_in_future: 7
max_years_in_past: 3

# local = read BHPetrol Product Delivery Notes offline (default)
# claude = any layout, via the Claude API (needs ANTHROPIC_API_KEY in .env next to this file)
engine: local
model: claude-opus-5-5
max_attempts: 5
